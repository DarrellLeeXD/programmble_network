# Four routers form a ring. Each has one LAN, and r1 summarises the two
# adjacent LANs behind r4 with one route to 10.40.32.0/23.
# The ring supplies a physical alternate path; static routes do not fail over.
# Only the last four student ID digits are recorded here.

student_id_last4: "4940"

routers: [r1, r2, r3, r4]

lans:
  - name: lan-h1
    network: 10.40.1.0/24
    router: r1
    host: h1
  - name: lan-h2
    network: 10.40.16.0/24
    router: r2
    host: h2
  - name: lan-h3
    network: 10.40.32.0/24
    router: r3
    host: h3
  - name: lan-h4
    network: 10.40.33.0/24
    router: r4
    host: h4

# On a router link, the first router receives .1 and the second receives .2.
links:
  - [r1, r2, 10.40.12.0/30]
  - [r2, r3, 10.40.23.0/30]
  - [r3, r4, 10.40.34.0/30]
  - [r4, r1, 10.40.41.0/30]

routes:
  r1:
    - to: 10.40.16.0/24
      via: 10.40.12.2
    - to: 10.40.32.0/23
      via: 10.40.41.1
  r2:
    - to: 10.40.1.0/24
      via: 10.40.12.1
    - to: 10.40.32.0/24
      via: 10.40.23.2
    - to: 10.40.33.0/24
      via: 10.40.23.2
  r3:
    - to: 10.40.1.0/24
      via: 10.40.23.1
    - to: 10.40.16.0/24
      via: 10.40.23.1
    - to: 10.40.33.0/24
      via: 10.40.34.2
  r4:
    - to: 10.40.1.0/24
      via: 10.40.41.2
    - to: 10.40.16.0/24
      via: 10.40.41.2
    - to: 10.40.32.0/24
      via: 10.40.34.1
