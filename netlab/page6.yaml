# page6.yaml: the words on your Week 6 page. make_page6.py puts each answer under its question.
# A few sentences each, in your own words, about YOUR overlay and YOUR evidence.
# Leave a blank line between paragraphs. Don't put your name or your full student ID in this file.

repository: https://github.com/DarrellLeeXD/programmble_network

answers:
  design:
    question: "Describe your design: hypervisors, tenants, VNIs and addresses. Which tenants overlap, and why did you place each VM where you did?"
    answer: >-
      Four hypervisors share the 10.40.0.0/24 underlay. Amber uses VNI 494001
      and violet uses VNI 494002. Both use 10.40.60.0/24, so am1 and vi1
      both have .10, while am2 and vi2 both have .11. Amber runs on hv1, hv2
      and hv3; violet runs on hv1, hv3 and hv4. This gives each tenant three
      VTEPs to test flooding, gives hv1 and hv3 both tenants, and makes hv3 an
      observer of amber traffic between hv1 and hv2. The shared subnet is
      intentional: the VNI, rather than an IP allocation rule, provides isolation.
  isolation:
    question: "Two of your VMs have the same IP address. Using your evidence, explain how a ping reaches the right one — and what would have to go wrong for one tenant to see another's traffic."
    answer: >-
      am1's ping to 10.40.60.11 must reach am2 on hv2, even though vi2 on hv3
      owns the same address. Amber's ARP and ICMP stay on br494001 and
      vxlan494001. The violet VM's simultaneous capture should see none of
      that exchange. The neighbor entry on am1 identifies am2 by its
      02:07:89:b1:00:0b MAC; vi1's entry for the same IP identifies vi2 by
      02:07:89:b2:00:0b. The different VNI bytes in those MACs help inspect
      the result, but the actual boundary is separate bridges and VNIs.
      Joining a violet VM port to the amber bridge, or mapping traffic to the
      wrong VNI at a VTEP, would break that boundary.
  flood_learn:
    question: "Using your evidence, explain what was flooded, to which hypervisors, and what each VTEP learned. With 50 hypervisors in one VNI, how many copies would one broadcast need — and how would EVPN change that?"
    answer: >-
      On a fresh build, hv1 has only all-zero flood FDB entries pointing at
      amber's other VTEPs, hv2 (10.40.0.2) and hv3 (10.40.0.3). am1's first
      ARP request is copied to both, so hv3 can capture VNI 494001 traffic
      even though the ping target am2 is on hv2. Source MAC learning then
      associates am1's MAC with hv1 and am2's MAC with hv2; later known-unicast
      packets need only one remote VTEP. With 50 hypervisors in a VNI, one
      head-end replicated broadcast needs 49 underlay copies. EVPN advertises
      MAC/IP locations through BGP and can answer ARP at the VTEP, avoiding
      many discovery floods; genuine broadcasts still need distribution.
  mtu:
    question: "Compare your two MTU fixes using your measurements. Which would you choose for a data centre, what does each cost, and who has to change what?"
    answer: >-
      Fix A limits each tenant to 1450 bytes, exactly 1500 minus VXLAN's
      50-byte overhead. A 1422-byte ping payload fills that 1450-byte inner
      IP packet, whereas 1423 is too large at the tenant interface. Fix B
      keeps the tenant MTU at 1500 and raises the underlay to 9000, letting a
      1472-byte payload fit but rejecting 1473 at the VM. I choose fix A for
      this four-hypervisor demonstration because it needs only the VM-side
      MTU policy and works on standard 1500-byte paths. It costs 50 bytes of
      tenant packet size and can reduce effective TCP throughput. A real data
      centre with end-to-end jumbo support could choose B to keep standard
      1500-byte tenant packets, but every underlay interface and any transit
      path must consistently support the larger frames; a single 1500-byte
      segment would recreate the black hole.
  p4:
    question: "If your hypervisors' VTEPs were P4 switches running the lecture's vtep.p4, what would have to fill the vtep_encap table, and how? What would replace flood-and-learn?"
    answer: >-
      The P4 control plane would install vtep_encap entries keyed by the
      tenant-facing ingress port and destination MAC. Each action supplies
      amber's or violet's VNI, this switch's VTEP address, the remote VTEP
      address, the next-hop MAC and the underlay output port. It would also
      fill vtep_decap entries keyed by VNI and inner destination MAC for local
      delivery. The lecture's vtep.p4 deliberately has no ARP or flooding,
      so these mappings must be supplied at run time. With EVPN, BGP
      advertisements of each VM's MAC/IP location would populate them before
      traffic; alternatively a controller could receive source-learning
      digests and write the entries, since the P4 data plane cannot add
      table entries itself.
