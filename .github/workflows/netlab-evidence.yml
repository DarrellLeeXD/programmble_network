name: Collect Mininet evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mininet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build network and capture observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p netlab/evidence
          docker run --rm -i --privileged \
            -v "$PWD/netlab:/lab" -w /lab \
            firdaussahran/netlab-mininet:1.0 \
            python3 build_topo.py topology.yaml <<'MININET' 2>&1 | tee netlab/evidence/session.txt
          pingall
          sh sleep 8
          h1 ip -6 addr show dev h1-eth0
          h2 ip -6 addr show dev h2-eth0
          h1 cat /proc/sys/net/ipv6/conf/all/disable_ipv6
          h1 ping -6 -c 1 fd00:4940::2 > evidence/ipv6.txt
          h1 ip -6 neigh
          h1 ip neigh > evidence/neigh.txt
          sh brctl showmacs s1 > evidence/macs.txt
          h2 ip -6 addr add fd00:4940::1/64 dev h2-eth0
          h2 ip addr add 10.40.0.1/24 dev h2-eth0
          sh sleep 5
          h2 ip -6 addr show dev h2-eth0 > evidence/dad.txt
          h2 ip -4 addr show dev h2-eth0 >> evidence/dad.txt
          exit
          MININET
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('netlab/evidence/session.txt').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if '*** Ping: testing ping reachability' in line)
          end = next(i for i in range(start, len(lines)) if '*** Results:' in lines[i])
          Path('netlab/evidence/pingall.txt').write_text('\n'.join(lines[start:end + 1]) + '\n')
          PY
          grep -q '0% dropped' netlab/evidence/pingall.txt
          grep -q '1 received' netlab/evidence/ipv6.txt
          for file in netlab/evidence/*.txt; do
            echo "EVIDENCE_BEGIN:$file"
            base64 -w 0 "$file"
            echo
            echo "EVIDENCE_END:$file"
          done
          grep -q 'dadfailed' netlab/evidence/dad.txt
          test -s netlab/evidence/neigh.txt
          test -s netlab/evidence/macs.txt
      - name: Upload captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mininet-evidence
          path: netlab/evidence/
